<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Molde da imagem de compartilhamento (paginas_seo/og-image.png, 1200x630). Os números vêm de calculo.py: rode `python gerar_og_image.py`. -->
<style>
@font-face{font-family:'Inter';font-weight:300 700;src:url('../paginas_seo/fonts/inter-latin.woff2') format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:600 700;src:url('../paginas_seo/fonts/playfair-display-latin.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:radial-gradient(ellipse at 90% 0%,#2d2653 0,#020617 55%);font-family:'Inter',sans-serif;color:#fff;position:relative;overflow:hidden}
.logo{position:absolute;left:72px;top:72px;height:48px}
h1{position:absolute;left:72px;top:170px;width:640px;font-family:'Playfair Display',serif;font-weight:700;font-size:62px;line-height:1.12}
h1 em{font-style:normal;color:#a78bfa}
.sub{position:absolute;left:72px;top:432px;width:640px;font-size:26px;line-height:1.35;color:#cbd5e1}
.card{position:absolute;left:792px;top:150px;width:336px;padding:30px 32px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(2,6,23,.85)}
.r{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}
.v{margin:8px 0 22px;font-size:42px;font-weight:700;color:#a78bfa}
.v2{margin:8px 0 22px;font-size:30px;font-weight:700;color:#fff}
.chips{position:absolute;left:72px;bottom:60px;display:flex;gap:14px}
.chip{padding:14px 22px;border:1px solid rgba(167,139,250,.4);border-radius:999px;background:rgba(76,29,149,.3);font-size:21px;font-weight:700;color:#c4b5fd}
.url{position:absolute;right:72px;bottom:70px;font-size:23px;font-weight:600;color:#94a3b8}
</style></head><body>
<img class="logo" src="../paginas_seo/logo-full.png" alt="">
<h1>Pix no cartão: veja <em>o custo</em> antes de contratar</h1>
<p class="sub">Parcela, IOF, total na fatura e CET, de R$&nbsp;300 a R$&nbsp;5.000 em 2x a 12x.</p>
<div class="card">
  <p class="r">Você recebe via Pix</p><p class="v">@@PIX@@</p>
  <p class="r">Total na fatura em @@N@@x</p><p class="v2">@@TOTAL@@</p>
  <p class="r">CET</p><p class="v2" style="margin-bottom:0">@@CET@@ ao ano</p>
</div>
<div class="chips"><span class="chip">Crédito caro: confira</span><span class="chip">Sem dado pessoal</span></div>
<p class="url">emprestimo.datalabglobal.com</p>
</body></html>
