<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Playfair Display';font-weight:600 700;src:url('@@FONTES@@/playfair-display-latin.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:300 700;src:url('@@FONTES@@/inter-latin.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#020617;background-image:radial-gradient(at 80% 0%,#1e293b 0,transparent 55%),radial-gradient(at 0% 100%,#2e1065 0,transparent 55%);color:#f8fafc;font-family:'Inter',sans-serif;padding:70px 80px;position:relative}
.top{display:flex;align-items:center;gap:22px}
.tile{width:150px;height:150px;border-radius:40px;display:grid;place-items:center;color:#a78bfa;background:linear-gradient(145deg,rgba(167,139,250,.16),rgba(15,23,42,.6));border:2px solid rgba(167,139,250,.4);box-shadow:0 0 60px -10px rgba(167,139,250,.5)}
.wm b{display:block;font-size:54px;font-weight:700;letter-spacing:-.02em}.wm i{display:block;font-style:normal;font-size:19px;letter-spacing:.44em;color:#a78bfa;margin-top:10px;font-weight:600}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:74px;line-height:1.08;margin-top:50px;max-width:1000px}
h1 em{font-style:normal;color:#a78bfa}
p{margin-top:26px;font-size:30px;color:#a3b1c6}
</style></head><body>
<div class="top"><span class="tile">@@LOGO@@</span><span class="wm"><b>Datalab</b><i>GLOBAL</i></span></div>
<h1>Empréstimo pessoal com <em>crédito do cartão</em></h1>
<p>Parcela, IOF e custo total antes de qualquer botão. Simulação grátis.</p>
</body></html>
