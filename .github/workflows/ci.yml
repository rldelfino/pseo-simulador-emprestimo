name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Gerar o site e compilar o CSS
        run: |
          python gerador_emprestimo.py
          npm run build:css
      - name: Testes (a saída do pytest é o critério de merge)
        run: python -m pytest -q
