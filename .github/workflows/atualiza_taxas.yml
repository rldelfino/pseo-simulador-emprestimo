name: Atualização semanal das taxas do Banco Central e rebuild do site

on:
  schedule:
    # segunda-feira, 08:00 UTC (antes da verificação da Tabela 10, às 11:00 UTC)
    - cron: '0 8 * * 1'
  workflow_dispatch:

# permissão de gravação para o robô commitar os dados e as páginas regeneradas
permissions:
  contents: write

jobs:
  atualiza-dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements-dev.txt

      - name: Atualizar taxas médias do Banco Central (dados/taxas_referencia.csv)
        # falha de rede não derruba o pipeline: o script avisa e mantém o CSV
        run: python etl_taxas_referencia.py

      - name: Regerar as páginas
        run: python gerador_emprestimo.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Compilar o CSS estático
        run: npm run build:css

      - name: Regerar as páginas com a versão nova do CSS (?v=)
        run: python gerador_emprestimo.py

      - name: Testes (nada é publicado se o pytest sair diferente de 0)
        run: python -m pytest -q

      - name: Gerar o pacote de publicação (Kaggle, Hugging Face, dados.gov.br)
        run: python publicacao.py

      - name: Commit e push dos dados e das páginas
        run: |
          git config --global user.name "Robô Datalab"
          git config --global user.email "bot@datalabglobal.com"
          git add dados paginas_seo publicacao
          git commit -m "auto: atualização semanal das taxas do Banco Central e rebuild do site" || echo "Sem mudanças"
          git push

      - name: Avisar o Bing (IndexNow) das páginas atualizadas
        # Só envia se o site já estiver no ar; espera o deploy do push acima. Falha de rede não derruba o pipeline.
        run: python indexnow.py --espera 240

      - uses: actions/setup-python@v5
        # o kaggle >= 1.8 (que aceita o token novo) exige Python 3.11 ou mais; o resto do pipeline continua no 3.10 do CI
        with:
          python-version: '3.12'

      - name: Atualizar os datasets no Kaggle (só roda se o segredo KAGGLE_API_TOKEN existir)
        # o token fica em Settings > Secrets and variables > Actions; sem ele este passo só avisa e segue. Por último e com continue-on-error:
        # falha do Kaggle nunca derruba o pipeline nem impede o aviso ao Bing.
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "Sem token do Kaggle: passo ignorado"; exit 0; fi
          pip install "kaggle>=1.8.0" six
          falhou=0
          for pasta in pix-no-cartao-tabela-10 taxas-referencia-bcb; do
            kaggle datasets version -p "publicacao/kaggle/$pasta" -m "atualização semanal" || { echo "Não consegui atualizar $pasta no Kaggle"; falhou=1; }
          done
          exit $falhou
