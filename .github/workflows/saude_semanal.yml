name: Saúde semanal do site

# Só manual por enquanto: o site ainda não está no ar em emprestimo.datalabglobal.com.
# Depois do deploy, descomente o schedule (segunda-feira, 12:00 UTC).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Verificar o site em produção
        run: >
          python verifica_saude.py
          --dominio https://emprestimo.datalabglobal.com
          --min-urls 1 --max-urls 60
          --paginas /
