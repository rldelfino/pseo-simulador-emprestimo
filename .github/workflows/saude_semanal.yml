name: Saúde semanal do site

# Site no ar em emprestimo.datalabglobal.com desde 14/11/2026: roda toda segunda-feira, 12:00 UTC (depois da atualização das 08:00).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Verificar o site em produção
        run: >
          python verifica_saude.py
          --dominio https://emprestimo.datalabglobal.com
          --min-urls 10 --max-urls 60
          --chave-indexnow 1402751d110047b584ffbd74c6d00b6c
          --paginas /,/como-funciona,/custo-cet-iof,/taxas-de-referencia,/dados-abertos,/metodologia
